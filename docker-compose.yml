# version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: ai-hmis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_hmis
      MYSQL_USER: hmis
      MYSQL_PASSWORD: hmis
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ai-hmis-network
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 20s
      timeout: 10s
      retries: 10
  backend:
    build:
      context: ../aihmisbackend
      dockerfile: Dockerfile
    image: ai-hmis-backend:latest
    container_name: ai-hmis-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_hmis
      SPRING_DATASOURCE_USERNAME: hmis
      SPRING_DATASOURCE_PASSWORD: hmis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - ai-hmis-network
  frontend:
    build:
      context: ../ai-hmis-frontend
      dockerfile: Dockerfile
    image: ai-hmis-frontend:latest
    container_name: ai-hmis-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ai-hmis-network
volumes:
  mysql-data:
networks:
  ai-hmis-network:
    driver: bridge
