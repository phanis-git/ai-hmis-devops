apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-hmis-ingress
  namespace: ai-hmis-namespace
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  ingressClassName: alb

  rules:
    - http:
        paths:

          # Backend APIs
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ai-hmis-backend-service
                port:
                  number: 8080

          # Angular Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-hmis-frontend-service
                port:
                  number: 80